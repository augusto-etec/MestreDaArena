        <script>
        // Função principal que será executada assim que a página carregar
        async function carregarDetalhesDaCarta() {
            try {
                // 1. PEGAR O NOME DA CARTA DA URL
                // URLSearchParams é uma forma moderna e segura de ler parâmetros da URL
                const params = new URLSearchParams(window.location.search);
                const nomeDaCarta = params.get('id'); // Pega o valor do parâmetro 'id' (que é o nome da carta)

                // Se não houver nome na URL, não faz nada.
                if (!nomeDaCarta) {
                    console.error("Nenhum nome de carta fornecido na URL.");
                    return;
                }

                // 2. BUSCAR O ARQUIVO JSON COM TODAS AS CARTAS
                // A página de detalhes também precisa carregar os dados
                const resposta = await fetch('./cartas.json');
                const dados = await resposta.json();
                const todasAsCartas = dados.items;

                // 3. ENCONTRAR A CARTA ESPECÍFICA NO MEIO DE TODAS
                // O método .find() procura no array pelo primeiro item que satisfaz a condição
                const cartaEncontrada = todasAsCartas.find(carta => carta.name === nomeDaCarta);

                // 4. VERIFICAR SE A CARTA FOI ENCONTRADA
                if (cartaEncontrada) {
                    // Se encontrou, vamos mostrar na tela
                    mostrarInformacoes(cartaEncontrada);
                } else {
                    // Se não encontrou, mostra uma mensagem de erro
                    document.getElementById('informacoes').innerHTML = `<h1>Carta não encontrada: ${nomeDaCarta}</h1>`;
                    console.error("A carta '" + nomeDaCarta + "' não foi encontrada no JSON.");
                }

            } catch (erro) {
                console.error("Erro ao carregar detalhes da carta:", erro);
                document.getElementById('informacoes').innerHTML = "<h1>Erro ao carregar informações.</h1>";
            }
        }

        // Função para colocar as informações da carta no HTML
        function mostrarInformacoes(carta) {
            // 5. PEGAR OS ELEMENTOS DO HTML ONDE VAMOS MOSTRAR AS INFORMAÇÕES
            const divImagem = document.getElementById('imagem');
            const divInformacoes = document.getElementById('informacoes');

            // 6. ATUALIZAR O HTML COM AS INFORMAÇÕES DA CARTA ENCONTRADA
            divImagem.innerHTML = `
                <div class="info">
                <img src="${carta.iconUrls.medium}" alt="${carta.name}" class="img-fluid"></div>
            `;

            divInformacoes.innerHTML = `
                <h1 id="txt1">${carta.name}</h1>    
                <div class="carta flex flex-col">    
                    <div class="flex flex-row gap-2 items-center">
                        <img src="./Images/elixirIcon.webp" id="icons"><p id="txt2"><strong>Custo de Elixir:</strong> ${carta.elixirCost}</p>
                    </div>
                    <div class="flex flex-row gap-2 items-center">
                        <img src="./Images/raridadeIcon.png" id="icons"><p id="txt2"><strong>Raridade:</strong> ${carta.rarity}</p>
                    </div>
                    <div class="flex flex-row gap-2 items-center">
                        <img src="./Images/nivelIcon.png" id="icons"><p id="txt2"><strong>Nível Máximo:</strong> ${carta.maxLevel}</p>
                    </div>
                    <div class="flex flex-row gap-2 items-center">
                        <img src="./Images/danoIcon.png" id="icons"><p id="txt2"><strong>Pontos De Dano (Nível de torneio):</strong> ${carta.dmg}</p>
                    </div>
                    <div class="flex flex-row gap-2 items-center">
                        <img src="./Images/vidaIcon.png" id="icons"><p id="txt2"><strong>Pontos De Vida (Nível de torneio):</strong> ${carta.hp}</p>
                    </div>
                </div>
            `;
            
    const divInfo = divImagem.querySelector('.info');

    // Define o fundo com base na raridade da carta
    switch (carta.rarity) {
        case 'comum':
            divInfo.style.background = 'url(./Images/CartaComum.png)'; 
            break;
        case 'raro':
            divInfo.style.background = 'url(./Images/CartaRara.png)';
            break;
        case 'épico':
            divInfo.style.background = 'url(./Images/CartaEpica.png)';
            break;
        case 'lendário':
            divInfo.style.background = 'url(./Images/CartaLendaria.png)';
            break;
        case 'campeão':
            divInfo.style.background = 'url(./Images/CartaCampeão.png)';
            break;
    }
        }

        // Chamar a função principal para iniciar tudo assim que a página for carregada
        carregarDetalhesDaCarta();
    </script>
